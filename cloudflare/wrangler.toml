name = "oisintexas-server"
main = "worker.ts"
compatibility_date = "2025-09-01"

[vars]
# Comma-separated list of allowed frontend origins, e.g. "https://oisintexas.vercel.app,http://localhost:3000"
ALLOWED_ORIGINS = "*"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

# SQLite-backed Durable Objects are available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
